---
# EVPN network density.
#
# NOT YET EXECUTED AGAINST A CLUSTER.
#
# Measures the cost of many EVPN networks: VTEP reconcile, VLAN/VNI
# consumption, FRRNodeState growth. Each MAC-VRF and each IP-VRF consumes one
# VLAN on the Single VXLAN Device, ceiling 4094 per VTEP. With withIPVRF=true
# this consumes two per network, so 1000 networks sits at ~49% of the ceiling.
#
# Ladder: 10 / 100 / 400 / 1000 networks. Cross the ceiling deliberately with
# additional VTEPs rather than tripping over it.
global:
  measurements:
    - name: pprof
      pprofInterval: 1m
      pprofDirectory: pprof-data
      pprofTargets:
      - name: ovnkube-control-plane
        namespace: "ovn-kubernetes"
        labelSelector: {name: ovnkube-control-plane}
        url: http://localhost:9411/debug/pprof/profile?seconds=30
      - name: ovnkube-controller
        namespace: "ovn-kubernetes"
        labelSelector: {app: ovnkube-node}
        url: http://localhost:9410/debug/pprof/profile?seconds=30

jobs:
- name: evpn-base
  jobIterations: 1
  qps: 10
  burst: 10
  waitWhenFinished: true
  cleanup: true
  objects:
    - objectTemplate: workloads/templates/bgp/frrconfiguration-receiver.yml
      replicas: 1
      inputVars:
        localASN: 65000
        peerASN: 65001
        peerIP: "172.18.0.5"

    - objectTemplate: workloads/templates/bgp/vtep.yml
      replicas: 1
      inputVars:
        vtepName: "perf-vtep"
        vtepCIDR: "100.64.0.0/24"
      waitOptions:
        customStatusPaths:
        - key: '(.conditions.[] | select(.type == "Accepted")).status'
          value: "True"

- name: evpn-density-networks
  jobIterations: 1
  qps: 10
  burst: 10
  waitWhenFinished: true
  cleanup: true
  # Capture FRRNodeState sizes and vtysh EVPN state; these are the numbers that
  # test the etcd object-size ceiling and cannot be Prometheus metrics.
  beforeCleanup: "hooks/collect-bgp-state.sh evpn-density"
  objects:
    - objectTemplate: workloads/templates/bgp/ns.yml
      replicas: 100

    - objectTemplate: workloads/templates/bgp/cudn_evpn_l2.yml
      replicas: 100
      inputVars:
        cidrPrefix: 20
        vtepName: "perf-vtep"
        macVNIBase: 100
        ipVNIBase: 10000
        withIPVRF: true
      waitOptions:
        customStatusPaths:
        - key: '(.conditions.[] | select(.type == "NetworkCreated")).status'
          value: "True"

    - objectTemplate: workloads/templates/bgp/ra-per-cudn.yml
      replicas: 100
      inputVars:
        targetVRF: "auto"
      waitOptions:
        customStatusPaths:
        - key: '(.conditions.[] | select(.type == "Accepted")).status'
          value: "True"
